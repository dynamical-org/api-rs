[package]
name = "dynapi-query"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
publish = false

[dependencies]
dynapi-contract = { path = "../dynapi-contract" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"

[dev-dependencies]
serde_json = { workspace = true, features = ["float_roundtrip", "arbitrary_precision"] }

[package]
name = "dynapi-reader"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[dependencies]
icechunk.workspace = true
icechunk-types.workspace = true
icechunk-storage.workspace = true
icechunk-format.workspace = true
icechunk-arrow-object-store.workspace = true
zarrs_icechunk.workspace = true
zarrs.workspace = true
zarrs_storage.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait = "0.1"
futures = "0.3"
http-body = { version = "1", default-features = false }
quick-xml = { version = "=0.41.0", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
# Preserve the existing TLS key-exchange preference when removing SDK defaults.
rustls = { version = "0.23", default-features = false, features = ["prefer-post-quantum"] }

zstd = "=0.14.3"
bytes = "1"
chrono = "0.4"
typetag = "0.2"
thiserror = "2"
gribberish = { version = "=1.5.0", default-features = false }
# Pin the core's caret-constrained tables/macros to the same qualified release.
gribberish-types = "=1.5.0"
gribberish-macros = "=1.5.0"

[dev-dependencies]
h2 = { version = "0.4", default-features = false }
tokio = { workspace = true, features = ["net", "io-util", "sync", "test-util"] }

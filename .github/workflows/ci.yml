name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Cache Cargo dependencies and host/container targets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-bookworm-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-bookworm-
      - name: Build and check one release profile in bookworm
        run: |
          mkdir -p "$HOME/.cargo/registry" target
          docker run --rm --memory=6g --memory-swap=6g --cpus=2 -v "$PWD:/workspace" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -v "$PWD/target:/workspace/target" -w /workspace \
            -e CARGO_TARGET_DIR=/workspace/target/bookworm \
            -e CARGO_BUILD_JOBS=2 \
            rust:1.97.0-bookworm bash -euc '
              apt-get update
              apt-get install -y cmake pkg-config libssl-dev
              rustup component add rustfmt clippy
              rustup target add wasm32-unknown-unknown
              cargo check --locked --target wasm32-unknown-unknown -p dynapi-contract -p dynapi-policy -p dynapi-query --keep-going
              cargo fmt --all --check
              cargo check --locked -p dynapi-server --no-default-features
              cargo build --locked --release --workspace --features dynapi-server/harness
              cargo test --locked --release --workspace --features dynapi-server/harness
              cargo clippy --locked --release --workspace --all-targets --features dynapi-server/harness -- -D warnings
            '
      - name: Restore Cargo cache ownership and readability
        if: always()
        run: |
          for cargo_cache_path in "$HOME/.cargo/registry" "$GITHUB_WORKSPACE/target"; do
            if [ -d "$cargo_cache_path" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$cargo_cache_path"
              sudo chmod -R u+rwX "$cargo_cache_path"
            fi
          done
      - name: Check ABI and bookworm runtime on the release artifacts
        run: |
          binary="$PWD/target/bookworm/release/dynapi-read"
          ci/check-glibc.sh "$binary"
          docker run --rm -i -v "$binary:/usr/local/bin/dynapi-read:ro" \
            debian:bookworm /usr/local/bin/dynapi-read <<< '{}' > /tmp/reader-smoke.json
          jq -e '.error.kind == "InvalidRequest"' /tmp/reader-smoke.json
          server_binary="$PWD/target/bookworm/release/dynapi-server"
          ci/check-glibc.sh "$server_binary"
          docker run --rm -v "$server_binary:/usr/local/bin/dynapi-server:ro" \
            debian:bookworm /usr/local/bin/dynapi-server --help
